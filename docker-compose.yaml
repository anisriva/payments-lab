version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: payments-lab-db
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: paymentslabadmin
      POSTGRES_PASSWORD: paymentslabpass
      POSTGRES_DB: paymentslab
    volumes:
      - .helpers/data/db:/var/lib/postgresql/data